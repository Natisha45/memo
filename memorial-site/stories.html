<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remembering [Name]</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .stories-header {
            text-align: center;
            padding: 50px 20px 30px;
            border-bottom: 1px solid #eee;
            margin-bottom: 40px;
        }

        .stories-header h1 {
            font-size: 2.5rem;
            color: #2D5A27;
            margin-bottom: 10px;
            font-family: 'Cormorant Garamond', serif;
        }

        .stories-header p {
            color: #666;
            font-size: 1.1rem;
        }

        .stories-section {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 60px;
        }

        .grid-story {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 28px;
        }

        .story-card {
            background: #fff;
            border-radius: 12px;
            padding: 28px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.07);
            border: 1px solid #eee;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .story-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }

        .story-card h2 {
            font-size: 1.2rem;
            color: #1a3a1a;
            margin: 0;
            font-family: 'Cormorant Garamond', serif;
        }

        .story-meta {
            font-size: 0.82rem;
            color: #888;
            display: flex;
            gap: 16px;
        }

        .story-excerpt {
            font-size: 0.95rem;
            color: #555;
            line-height: 1.6;
            flex: 1;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .read-more-btn {
            align-self: flex-start;
            background: none;
            border: 1px solid #2D5A27;
            color: #2D5A27;
            padding: 7px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Raleway', sans-serif;
        }

        .read-more-btn:hover {
            background: #2D5A27;
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #999;
            grid-column: 1 / -1;
        }

        .empty-state p {
            font-size: 1.1rem;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 680px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
            line-height: 1;
        }

        .modal-close:hover {
            color: #333;
        }

        .modal h2 {
            font-size: 1.6rem;
            color: #1a3a1a;
            margin-bottom: 8px;
            font-family: 'Cormorant Garamond', serif;
            padding-right: 30px;
        }

        .modal-meta {
            font-size: 0.82rem;
            color: #888;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid #eee;
        }

        .modal-content {
            font-size: 1rem;
            color: #444;
            line-height: 1.8;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px;
            color: #999;
            grid-column: 1 / -1;
        }

        @media (max-width: 1024px) {
            .grid-story { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 640px) {
            .grid-story { grid-template-columns: 1fr; }
            .stories-header h1 { font-size: 2rem; }
            .modal { padding: 28px 20px; }
        }
    </style>
</head>
<body>
    <div id="navbar"></div>

    <main>
        <div class="stories-header">
            <h1>Stories & Memories</h1>
            <p>Tributes shared by those who knew and loved him</p>
        </div>

        <div class="stories-section">
            <div class="grid-story" id="storiesGrid">
                <div class="loading">Loading stories...</div>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="modal-close" id="modalClose">&times;</button>
            <h2 id="modalTitle"></h2>
            <div class="modal-meta" id="modalMeta"></div>
            <div class="modal-content" id="modalContent"></div>
        </div>
    </div>

    <div id="footer"></div>
    <script src="components.js"></script>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const supabase = createClient(
            'https://fwganmdvjmmsgqlsfgkp.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3Z2FubWR2am1tc2dxbHNmZ2twIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNDc2MjcsImV4cCI6MjA5NjkyMzYyN30.PHmmYyBnANjGVzBPWUXKfoXjGV46l4l6l8TKiINQQ5w'
        );

        const grid = document.getElementById('storiesGrid');
        const overlay = document.getElementById('modalOverlay');
        const modalClose = document.getElementById('modalClose');

        // Load approved stories
        const { data: stories, error } = await supabase
            .from('stories')
            .select('*')
            .eq('status', 'approved')
            .order('created_at', { ascending: false });

        if (error || !stories || stories.length === 0) {
            grid.innerHTML = `
                <div class="empty-state">
                    <p>No stories have been shared yet.</p>
                    <p>Be the first to <a href="share.html" style="color:#2D5A27">share a memory</a>.</p>
                </div>`;
        } else {
            grid.innerHTML = stories.map(story => `
                <div class="story-card">
                    <h2>${story.title}</h2>
                    <div class="story-meta">
                        <span>By ${story.author}</span>
                        <span>${new Date(story.created_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}</span>
                    </div>
                    <p class="story-excerpt">${story.content}</p>
                    <button class="read-more-btn" data-id="${story.id}">Read More</button>
                </div>
            `).join('');

            // Read More click handler
            grid.addEventListener('click', (e) => {
                if (e.target.classList.contains('read-more-btn')) {
                    const id = parseInt(e.target.dataset.id);
                    const story = stories.find(s => s.id === id);
                    if (story) {
                        document.getElementById('modalTitle').textContent = story.title;
                        document.getElementById('modalMeta').textContent = 
                            `By ${story.author} · ${new Date(story.created_at).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' })}`;
                        document.getElementById('modalContent').textContent = story.content;
                        overlay.classList.add('active');
                    }
                }
            });
        }

        // Close modal
        modalClose.addEventListener('click', () => overlay.classList.remove('active'));
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) overlay.classList.remove('active');
        });
    </script>
</body>
</html>
