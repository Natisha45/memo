<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remembering [Name]</title>
    <link rel="stylesheet" href="style.css">

    <style>
    body {
        font-family: 'Crimson Text', serif; /* Consistent with other pages */
        background-color: #fefefe;
        margin: 0;
        padding: 0;
        line-height: 1.6;
    }
    
    .page-header {
        background-color: transparent; /* Changed from #e2e2e2 */
        padding: 40px 0 20px;
        text-align: center;
        border-bottom: 1px solid #eee;
        margin-bottom: 40px;
    }
    
    .page-header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        font-family: 'Cormorant Garamond', serif;
    }
    
    .page-header p {
        color: #666;
        font-size: 1.1rem;
        font-style: italic;
    }
    
    /* Gallery Section */
    .memories-gallery {
        padding: 0 20px 40px;
    }
    
    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
    }
    
    /* Filters - Redesigned to match image */
    .gallery-filters {
        text-align: center;
        margin-bottom: 40px;
        padding-bottom: 20px;
        border-bottom: 1px solid #ddd;
    }
    
    .filter-btn {
        background-color: transparent;
        color: #666;
        padding: 10px 24px;
        border: 1px solid #ddd;
        margin: 0 8px;
        cursor: pointer;
        border-radius: 4px;
        font-family: 'Raleway', sans-serif;
        font-size: 15px;
        transition: all 0.3s;
    }
    
    .filter-btn:hover {
        background-color: #f5f5f5;
        color: #333;
    }
    
    .filter-btn.active {
        background-color: #2D5A27; /* Green from theme */
        color: white;
        border-color: #2D5A27;
    }
    
    /* Gallery Grid - NEW STRUCTURE to match image */
    .gallery-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 30px;
    }
    
    .gallery-item {
        background-color: white;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        transition: transform 0.3s, box-shadow 0.3s;
    }
    
    .gallery-item:hover {
        transform: translateY(-5px);
        box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    
    /* Image styling */
    .gallery-item img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        display: block;
    }
    
    /* Caption area - matching your image */
    .gallery-caption {
        padding: 20px;
        text-align: center;
        border-top: 1px solid #f0f0f0;
    }
    
    .gallery-caption h3 {
        margin: 0 0 8px 0;
        font-size: 1.2rem;
        color: #222;
        font-family: 'Cormorant Garamond', serif;
        font-weight: 500;
    }
    
    .gallery-caption .year {
        color: #777;
        font-size: 0.9rem;
        font-family: 'Raleway', sans-serif;
        font-style: italic;
    }
    
    /* Video wrapper */
    .video-wrapper {
        position: relative;
        padding-bottom: 56.25%;
        height: 0;
        overflow: hidden;
    }
    
    .video-wrapper iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
    }
    
    /* Divider line */
    .divider {
        height: 1px;
        background-color: #eee;
        margin: 40px 0;
        grid-column: 1 / -1;
    }
    
    /* Responsive */
    @media (max-width: 768px) {
        .gallery-grid {
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        
        .filter-btn {
            padding: 8px 16px;
            margin: 5px;
            font-size: 14px;
        }
        
        .page-header h1 {
            font-size: 2rem;
        }
    }
    
    @media (max-width: 480px) {
        .gallery-grid {
            grid-template-columns: 1fr;
        }
        
        .filter-btn {
            display: block;
            width: 100%;
            margin: 5px 0;
        }
    }
</style>
</head>
<body>
   <div id="navbar"></div>

    <!-- Page content will go here -->
    <main>
    <section class="page-header">
        <div class="container">
            <h1>Memories</h1>
            <p>Photos and videos celebrating [Name]'s life</p>
        </div>
    </section>

    <section class="memories-gallery">
        <div class="container">
            <div class="gallery-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="photos">Photos</button>
                <button class="filter-btn" data-filter="videos">Videos</button>
            </div>

            
                <div class="gallery-grid" id="galleryGrid">
                <div style="text-align:center; padding: 60px; color: #999; grid-column: 1/-1;">
                    Loading memories...
                </div>
            </div>

        </div>
    </section>
</main>
    

<div id="footer"></div>
<script src="components.js"></script>
    <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabase = createClient(
        'https://fwganmdvjmmsgqlsfgkp.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3Z2FubWR2am1tc2dxbHNmZ2twIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNDc2MjcsImV4cCI6MjA5NjkyMzYyN30.PHmmYyBnANjGVzBPWUXKfoXjGV46l4l6l8TKiINQQ5w'
    );

    const grid = document.getElementById('galleryGrid');
    let allMedia = [];
    let currentFilter = 'all';

    const { data: media, error } = await supabase
        .from('media')
        .select('*')
        .eq('status', 'approved')
        .order('created_at', { ascending: false });

    if (error || !media || media.length === 0) {
        grid.innerHTML = `const 
            <div style="text-align:center; padding: 60px; color: #999; grid-column: 1/-1;">
                <p>No memories have been added yet.</p>
            </div>`;
    } else {
        allMedia = media;
        renderGallery('all');
    }

    function renderGallery(filter) {
        const filtered = filter === 'all' 
            ? allMedia 
            : allMedia.filter(m => m.type === filter);

        if (filtered.length === 0) {
            grid.innerHTML = `
                <div style="text-align:center; padding: 60px; color: #999; grid-column: 1/-1;">
                    <p>No ${filter} found.</p>
                </div>`;
            return;
        }

        grid.innerHTML = filtered.map(item => `
            <div class="gallery-item" data-type="${item.type}">
                ${item.type === 'video'
                    ? `<div class="video-wrapper">
                            <video src="${item.src}" controls style="width:100%; height:100%; object-fit:cover;"></video>
                       </div>`
                    : `<img src="${item.src}" alt="${item.title}" loading="lazy">`
                }
                <div class="gallery-caption">
                    <h3>${item.title || 'Untitled'}</h3>
                    <p class="year">${item.year || ''}</p>
                </div>
            </div>
        `).join('');
    }

    // Filter buttons
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentFilter = btn.dataset.filter;
            // map 'photos' to 'photo' and 'videos' to 'video'
            const filterValue = currentFilter === 'photos' ? 'photo' 
                              : currentFilter === 'videos' ? 'video' 
                              : 'all';
            renderGallery(filterValue);
        });
    });
</script>
</body>
</html>
