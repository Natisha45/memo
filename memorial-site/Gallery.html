<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memories | Remembering Mr. Urgessa</title>
  <link rel="stylesheet" href="style.css">
  <style>

    .page-header {
  text-align: center;
  padding: 50px 20px 30px;
  border-bottom: 1px solid #eee;
  margin-bottom: 40px;
}

.page-header h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 2.5rem;
  color: #2D5A27;
  margin-bottom: 8px;
}

.page-header p {
  color: #666;
  font-style: italic;
}
    .memories-gallery { padding: 0 20px 60px; }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

 .gallery-item {
  background: white;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
  transition: transform 0.3s, box-shadow 0.3s;
}

.gallery-item:hover {
  transform: translateY(-5px);
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.gallery-item img,
.gallery-item video {
  width: 100%;
  height: 260px;
  object-fit: contain;
  object-position: center;
  display: block;
  background: #f5f5f5;
}
    .gallery-filters {
      text-align: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid #ddd;
    }

    .filter-btn {
      background: transparent;
      color: #666;
      padding: 10px 24px;
      border: 1px solid #ddd;
      margin: 0 8px;
      cursor: pointer;
      border-radius: 4px;
      font-family: 'Raleway', sans-serif;
      font-size: 15px;
      transition: all 0.3s;
    }

    .filter-btn:hover { background: #f5f5f5; color: #333; }

    .filter-btn.active {
      background: #2D5A27;
      color: white;
      border-color: #2D5A27;
    }

    @media (max-width: 768px) {
      .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
      .filter-btn { padding: 8px 16px; margin: 5px; font-size: 14px; }
    }

    @media (max-width: 480px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .gallery-item img, .gallery-item video { height: 160px; }
      .filter-btn { display: block; width: 100%; margin: 5px 0; }
    }
  </style>
</head>
<body>
  <div id="navbar"></div>

  <main>
    <div class="page-header">
      <h1>Memories</h1>
      <p>Photos and videos celebrating Mr. Urgessa's life</p>
    </div>

    <div class="memories-gallery">
      <div class="container">
        <div class="gallery-filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="photo">Photos</button>
          <button class="filter-btn" data-filter="video">Videos</button>
        </div>
        <div class="gallery-grid" id="galleryGrid">
          <div style="text-align:center;padding:60px;color:#999;grid-column:1/-1;">
            Loading memories...
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer"></div>
  <script src="components.js"></script>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const supabase = createClient(
      'https://fwganmdvjmmsgqlsfgkp.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ3Z2FubWR2am1tc2dxbHNmZ2twIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNDc2MjcsImV4cCI6MjA5NjkyMzYyN30.PHmmYyBnANjGVzBPWUXKfoXjGV46l4l6l8TKiINQQ5w'
    );

    const grid = document.getElementById('galleryGrid');
    let allMedia = [];

    const { data: media, error } = await supabase
      .from('media')
      .select('*')
      .eq('status', 'approved')
      .order('created_at', { ascending: false });

    if (error || !media || media.length === 0) {
      grid.innerHTML = `
        <div style="text-align:center;padding:60px;color:#999;grid-column:1/-1;">
          <p>No memories have been added yet.</p>
        </div>`;
    } else {
      allMedia = media;
      renderGallery('all');
    }

    function renderGallery(filter) {
      const filtered = filter === 'all'
        ? allMedia
        : allMedia.filter(m => m.type === filter);

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="text-align:center;padding:60px;color:#999;grid-column:1/-1;">
            <p>No ${filter}s found.</p>
          </div>`;
        return;
      }

      grid.innerHTML = filtered.map(item => `
        <div class="gallery-item" data-type="${item.type}">
          ${item.type === 'video'
            ? `<video src="${item.src}" controls></video>`
            : `<img src="${item.src}" alt="Memory" loading="lazy">`
          }
        </div>`).join('');
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGallery(btn.dataset.filter);
      });
    });
  </script>
</body>
</html>
